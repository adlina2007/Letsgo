name: Build Letsgo Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:

    name: Build Android APK

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. دریافت سورس پروژه
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. نصب Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. تنظیم Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. نصب SDK Platform 36 و Platform Tools
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"

      # 6. پذیرش Licenseهای Android
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 7. نصب وابستگی‌های Node
      - name: Install npm dependencies
        run: npm ci

      # 8. Build پروژه Vite
      - name: Build web application
        run: npm run build

      # 9. Sync کردن Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 10. تنظیم Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 11. دادن مجوز اجرای Gradle Wrapper
      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      # 12. ساخت APK Debug
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 13. ذخیره APK به عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: letsgo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error