name: Build Letsgo Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # 3. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Verify Java
      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 5. Verify Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true

      # 6. Install Android Platform 36
      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36"

      # 7. Verify Android Platform
      - name: Verify Android SDK Platform 36
        run: |
          sdkmanager --list | grep "platforms;android-36"

      # 8. Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 9. Build Vite
      - name: Build web application
        run: npm run build

      # 10. Capacitor Sync
      - name: Sync Capacitor
        run: npx cap sync android

      # 11. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 12. Make Gradle executable
      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      # 13. Build APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: letsgo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error