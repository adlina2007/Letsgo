name: Build Letsgo Android APK

on:
  workflow_dispatch:
push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install Android SDK Command-line Tools
      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip

          unzip -q commandlinetools-linux-14742923_latest.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 5. Verify sdkmanager
      - name: Verify Android SDK Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      # 6. Install Android SDK Platform 36
      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"

      # 7. Verify Android SDK
      - name: Verify Android SDK Platform 36
        run: |
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/platforms/android-36"

      # 8. Install npm dependencies
      - name: Install npm dependencies
        run: npm ci

      # 9. Build Vite
      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Gradle Java Environment
        working-directory: android
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew -version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info

      # Rename APK
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Letsgo.apk

      # Upload APK as Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Letsgo
          path: Letsgo.apk
          if-no-files-found: error

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Letsgo.apk
          generate_release_notes: true
          name: Letsgo ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}